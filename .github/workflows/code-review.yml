name: Automated Code Review for Bai07

on:
  push:
    branches: [ "main" ] # Chạy ngay khi push lên main
  pull_request:
    branches: [ "main" ]

jobs:
  checkstyle:
    name: Checkstyle Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Nâng cấp lên v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4 # Nâng cấp lên v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Checkstyle
        # SỬA: Bỏ --file Bai07/pom.xml nếu pom.xml nằm ở gốc
        run: mvn checkstyle:check